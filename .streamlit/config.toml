[theme]
base = "light"
primaryColor = "#1B4332"
backgroundColor = "#F3F6F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14201a"
font = "sans serif"
# Used when Streamlit remaps Plotly — keep xP (2nd series) vivid, never near-white
chartCategoricalColors = [
  "#1B4332",
  "#C9A227",
  "#1D4ED8",
  "#B45309",
  "#0F766E",
  "#7C3AED",
]

[server]
headless = true
